rules:
- id: php-xss-echo-get-post
  languages: [php]
  message: 'User input from superglobals echoed directly to the page without encoding.
    Use htmlspecialchars($input, ENT_QUOTES, ''UTF-8'') to prevent cross-site scripting.

    '
  metadata: {category: security, confidence: HIGH, cwe: CWE-79, impact: HIGH, owasp: 'A03:2021
      Injection'}
  patterns:
  - pattern-either:
    - {pattern: 'echo $_GET[$KEY];

        '}
    - {pattern: 'echo $_POST[$KEY];

        '}
    - {pattern: 'echo $_REQUEST[$KEY];

        '}
    - {pattern: 'print $_GET[$KEY];

        '}
    - {pattern: 'print $_POST[$KEY];

        '}
    - {pattern: 'print $_REQUEST[$KEY];

        '}
  severity: ERROR
- id: php-file-inclusion-superglobals
  languages: [php]
  message: 'File inclusion directly from superglobal input. This is a critical LFI/RFI
    vulnerability that can lead to remote code execution.

    '
  metadata: {category: security, confidence: HIGH, cwe: CWE-98, impact: CRITICAL,
    owasp: 'A03:2021 Injection'}
  patterns:
  - pattern-either:
    - {pattern: 'include($_GET[$KEY])

        '}
    - {pattern: 'include($_POST[$KEY])

        '}
    - {pattern: 'include($_REQUEST[$KEY])

        '}
    - {pattern: 'require($_GET[$KEY])

        '}
    - {pattern: 'require($_POST[$KEY])

        '}
  severity: ERROR
- id: php-unserialize
  languages: [php]
  message: 'unserialize() with untrusted data can lead to object injection and remote
    code execution. Use json_decode() for data interchange or restrict allowed classes
    with the second parameter.

    '
  metadata: {category: security, confidence: HIGH, cwe: CWE-502, impact: CRITICAL,
    owasp: 'A08:2021 Software and Data Integrity Failures'}
  patterns:
  - {pattern: 'unserialize($INPUT)

      '}
  - {pattern-not: 'unserialize("...")

      '}
  severity: ERROR
