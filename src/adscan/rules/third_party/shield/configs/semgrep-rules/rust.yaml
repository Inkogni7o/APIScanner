rules:
- id: rust-sql-injection
  languages: [rust]
  message: 'SQL query built with format! macro or string concatenation. Use parameterized
    queries with bind parameters (e.g., sqlx::query("SELECT ... WHERE id = $1").bind(id))
    to prevent SQL injection.

    '
  metadata:
    category: security
    confidence: HIGH
    cwe: [CWE-89]
    impact: CRITICAL
    owasp: ['A03:2021 Injection']
  patterns:
  - pattern-either:
    - {pattern: '$CLIENT.query(&format!("...", $INPUT), ...)

        '}
    - {pattern: '$CLIENT.execute(&format!("...", $INPUT), ...)

        '}
    - {pattern: 'sqlx::query(&format!("...", $INPUT))

        '}
    - {pattern: '$CLIENT.query(& ("..." .to_owned() + &$INPUT + "..."), ...)

        '}
  severity: ERROR
- id: rust-hardcoded-secrets
  languages: [rust]
  message: 'Hardcoded credential detected in a string literal. Store secrets in environment
    variables (std::env::var), a secrets manager, or encrypted configuration — never
    in source code.

    '
  metadata:
    category: security
    confidence: MEDIUM
    cwe: [CWE-798]
    impact: HIGH
    owasp: ['A07:2021 Identification and Authentication Failures']
  patterns:
  - pattern-either:
    - {pattern: 'let $X = "...";

        '}
    - {pattern: 'let $X: &str = "...";

        '}
    - {pattern: 'const $X: &str = "...";

        '}
    - {pattern: 'static $X: &str = "...";

        '}
  - metavariable-regex: {metavariable: $X, regex: '(?i)(password|passwd|secret|api_key|apikey|token|secret_key|secretkey)'}
  severity: ERROR
- id: rust-insecure-tls
  languages: [rust]
  message: 'TLS certificate or hostname verification is disabled. This allows man-in-the-middle
    attacks. Remove this option or restrict it to development/testing environments
    only.

    '
  metadata:
    category: security
    confidence: HIGH
    cwe: [CWE-295]
    impact: HIGH
    owasp: ['A02:2021 Cryptographic Failures']
  patterns:
  - pattern-either:
    - {pattern: $CLIENT.danger_accept_invalid_certs(true)}
    - {pattern: $CLIENT.danger_accept_invalid_hostnames(true)}
  severity: ERROR
